[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npx prisma generate && npx tsc"

[deploy]
startCommand = "sh -c 'npx prisma db push --skip-generate || true; node dist/server.js'"
healthcheckPath = "/health"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[service]
internalPort = 3000
