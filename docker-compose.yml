services:
  postgres:
    image: postgres:16-alpine
    container_name: lk-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: lkchatbot
      POSTGRES_PASSWORD: lkchatbot
      POSTGRES_DB: lk_chatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lkchatbot']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lk-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6380}:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: lk-evolution
    restart: unless-stopped
    ports:
      - '${EVOLUTION_PORT:-8080}:8080'
    environment:
      # IMPORTANT: Set EVOLUTION_API_KEY in your .env file, never use "change-me" in production
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-in-dotenv}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://lkchatbot:lkchatbot@postgres:5432/lk_chatbot
      DATABASE_CONNECTION_CLIENT_NAME: evolution_v2
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_LOCAL_ENABLED: 'false'
      # Webhook configuration — Evolution API will send events to this URL
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_BASE_URL:-http://host.docker.internal:3000}/webhook/evolution
      WEBHOOK_GLOBAL_ENABLED: 'true'
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: 'false'
      WEBHOOK_EVENTS_MESSAGES_UPSERT: 'true'
      WEBHOOK_EVENTS_MESSAGES_UPDATE: 'true'
      WEBHOOK_EVENTS_CONNECTION_UPDATE: 'true'
      WEBHOOK_EVENTS_QRCODE_UPDATED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
