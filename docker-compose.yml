version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lk-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: lkchatbot
      POSTGRES_PASSWORD: lkchatbot
      POSTGRES_DB: lk_chatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lk-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: lk-evolution
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      AUTHENTICATION_API_KEY: change-me
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://lkchatbot:lkchatbot@postgres:5432/lk_chatbot
      DATABASE_CONNECTION_CLIENT_NAME: evolution_v2
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_LOCAL_ENABLED: 'false'
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
